<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>7-Day Fat Loss Reset | Byron Online Coaching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];

</head>

<body style="font-family: Arial, sans-serif; background:#f8f8f8; padding:20px;">

  <div style="max-width:600px; margin:auto; background:#fff; padding:25px; border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.08);">

    <h1 style="margin-top:0;">🔥 Get My Free 7-Day Fat Loss Reset</h1>

    <p style="line-height:1.5;">
      Lose fat, build momentum, and feel better in just 7 days — without extreme dieting.
    </p>

    <h3>You’ll Get:</h3>
    <ul style="line-height:1.6;">
      <li>Home + Gym Workouts</li>
      <li>Daily Step Goals</li>
      <li>Simple Nutrition Structure</li>
      <li>Accountability System</li>
    </ul>

    <h3>Enter Your Info Below:</h3>

    <!-- ================= LEAD FORM ================= -->
    <form id="leadForm" autocomplete="on">

      <input id="name" type="text" name="name" placeholder="First Name" required
        style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">

      <input id="email" type="email" name="email" placeholder="Email" required
        style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">

      <input id="phone" type="tel" name="phone" placeholder="Phone Number" required
        style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ddd; border-radius:8px;">

      <select id="goal" name="goal" required
        style="width:100%; padding:12px; margin-bottom:15px; border:1px solid #ddd; border-radius:8px;">
        <option value="Lose Fat">Lose Fat</option>
        <option value="Tone Up">Tone Up</option>
        <option value="Build Strength">Build Strength</option>
        <option value="Get Consistent">Get Consistent</option>
      </select>

      <button id="submitBtn" type="submit"
        style="width:100%; padding:14px; background:black; color:white; border:none; font-size:16px; border-radius:10px; cursor:pointer;">
        Get Free Access
      </button>

      <div id="statusMsg" style="margin-top:12px; font-size:14px;"></div>

    </form>
    <!-- ============================================= -->

    <p style="margin-top:15px; font-size:12px; color:#555;">
      We respect your privacy. No spam.
    </p>

  </div>

  <!-- ================= FORM LOGIC ================= -->
  <script>
    /*
      ✅ REQUIRED (BEST VERSION):
      1) GOOGLE_FORM_RESPONSE_URL (must end with /formResponse)
      2) ENTRY IDs for each field (entry.xxxxx)

      ✅ FALLBACK (still works if you don’t have the above yet):
      - It will redirect to your public Google Form link so you still capture the lead manually.
    */

    // Your public Google Form link (fallback redirect)
    const GOOGLE_FORM_PUBLIC_LINK = "https://forms.gle/dPGv9o1ympoxaSad7";

    // AFTER submit, send them to your Reset Doc / Thank You page
    const DELIVERY_LINK = "PASTE_YOUR_RESET_GOOGLE_DOC_OR_THANKYOU_LINK_HERE";

    // ---- Paste these when you grab them ----
    const GOOGLE_FORM_RESPONSE_URL = "PASTE_FORMRESPONSE_URL_HERE"; // example: https://docs.google.com/forms/d/e/XXXX/formResponse

    const ENTRY_NAME  = "entry.111111111111";
    const ENTRY_EMAIL = "entry.222222222222";
    const ENTRY_PHONE = "entry.333333333333";
    const ENTRY_GOAL  = "entry.444444444444";
    // --------------------------------------

    const leadForm  = document.getElementById("leadForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    function isConfiguredForBackgroundSubmit() {
      return (
        GOOGLE_FORM_RESPONSE_URL &&
        GOOGLE_FORM_RESPONSE_URL.includes("formResponse") &&
        ENTRY_NAME.startsWith("entry.") &&
        ENTRY_EMAIL.startsWith("entry.") &&
        ENTRY_PHONE.startsWith("entry.") &&
        ENTRY_GOAL.startsWith("entry.")
      );
    }

    leadForm.addEventListener("submit", async function(e) {
      e.preventDefault();

      // Disable button to prevent double submits
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.75";
      submitBtn.textContent = "Submitting...";
      statusMsg.textContent = "One sec…";

      const name  = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const goal  = document.getElementById("goal").value;

      // Fire Meta Lead Event
      if (typeof fbq === "function") {
        fbq("track", "Lead");
      }

      // If not configured yet, fallback to Google Form page
      if (!isConfiguredForBackgroundSubmit()) {
        statusMsg.textContent = "Almost there… sending you to the form.";
        setTimeout(() => {
          window.location.href = GOOGLE_FORM_PUBLIC_LINK;
        }, 500);
        return;
      }

      // Background submit to Google Form
      try {
        const data = new FormData();
        data.append(ENTRY_NAME, name);
        data.append(ENTRY_EMAIL, email);
        data.append(ENTRY_PHONE, phone);
        data.append(ENTRY_GOAL, goal);

        await fetch(GOOGLE_FORM_RESPONSE_URL, {
          method: "POST",
          mode: "no-cors",
          body: data
        });

        statusMsg.textContent = "Done ✅ Redirecting…";

      } catch (err) {
        // Even if fetch fails, we’ll still redirect (and you still got the Meta Lead)
        console.log("Google form submit error:", err);
        statusMsg.textContent = "Redirecting…";
      }

      // Redirect to your reset / thank you
      setTimeout(() => {
        window.location.href = DELIVERY_LINK;
      }, 700);
    });
  </script>
  <!-- ============================================= -->

</body>
</html>
