<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>7-Day Fat Loss Reset | Byron Online Coaching</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ================= META PIXEL ================= -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];
    t=b.createElement(e);t.async=!0;
    t.src=v;
    s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1420563573143889');
    fbq('track', 'PageView');
  </script>
</head>

<body style="font-family: Arial, sans-serif; background:#f8f8f8; padding:20px;">

  <div id="mainBox"
    style="max-width:600px; margin:auto; background:#fff; padding:25px;
    border-radius:10px; box-shadow:0 6px 16px rgba(0,0,0,.08);">

    <h1>🔥 Get My Free 7-Day Fat Loss Reset</h1>

    <p>
      Lose fat, build momentum, and feel better in just 7 days — without extreme dieting.
    </p>

    <h3>You’ll Get:</h3>
    <ul>
      <li>Home + Gym Workouts</li>
      <li>Daily Step Goals</li>
      <li>Simple Nutrition Structure</li>
      <li>Accountability System</li>
    </ul>

    <h3>Enter Your Info Below:</h3>

    <!-- FORM -->
    <form id="leadForm">

      <input id="name" type="text" placeholder="Name" required
        style="width:100%; padding:12px; margin-bottom:10px;">

      <input id="email" type="email" placeholder="Email" required
        style="width:100%; padding:12px; margin-bottom:10px;">

      <input id="phone" type="tel" placeholder="Phone" required
        style="width:100%; padding:12px; margin-bottom:10px;">

      <select id="goal" required
        style="width:100%; padding:12px; margin-bottom:15px;">
        <option>Fat Loss</option>
        <option>Build Muscle</option>
        <option>Tone Up</option>
        <option>Improve Energy</option>
        <option>Get Back in Shape</option>
      </select>

      <button id="submitBtn" type="submit"
        style="width:100%; padding:14px; background:black; color:white;
        border:none; font-size:16px; cursor:pointer;">
        Get Free Access
      </button>

      <div id="status" style="margin-top:12px;"></div>

    </form>

    <p style="font-size:12px; color:#555;">
      We respect your privacy. No spam.
    </p>

  </div>

  <!-- LOGIC -->
  <script>

    // Google Form submit endpoint
    const FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSddNw9ku4TNGIUv0WDYcxNJ9LXSrrLiA5LitnSzVC8C20gvhg/formResponse";

    // Reset Program
    const RESET_DOC =
      "https://docs.google.com/document/d/1qyak5SQKTRztHzg1vM8b3aPqIYF4KjEm9Rl7WYHQmM4/view?usp=sharing";

    // Entry IDs
    const ENTRY_NAME  = "entry.14153905";
    const ENTRY_EMAIL = "entry.985988409";
    const ENTRY_PHONE = "entry.1317232275";
    const ENTRY_GOAL  = "entry.624894712";


    const form = document.getElementById("leadForm");
    const box  = document.getElementById("mainBox");

    form.addEventListener("submit", async function(e){

      e.preventDefault();

      // Fire pixel
      if (typeof fbq === "function") fbq("track","Lead");

      const name  = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;
      const goal  = document.getElementById("goal").value;

      // Build payload
      const data = new FormData();

      data.append(ENTRY_NAME, name);
      data.append(ENTRY_EMAIL, email);
      data.append(ENTRY_PHONE, phone);
      data.append(ENTRY_GOAL, goal);

      // Send to Google
      try {
        await fetch(FORM_URL,{
          method:"POST",
          mode:"no-cors",
          body:data
        });
      } catch(err){}

      // THANK YOU SCREEN
      box.innerHTML = `
        <h2>✅ You’re In!</h2>

        <p>
          Your 7-Day Reset is opening now.
        </p>

        <p>
          If it doesn’t open automatically,
          <a href="${RESET_DOC}" target="_blank">
          click here</a>.
        </p>

        <p style="margin-top:15px;">
          Let’s work 💪🏾🔥
        </p>
      `;

      // Open reset in new tab (mobile safe)
      setTimeout(()=>{
        window.open(RESET_DOC,"_blank");
      },800);

    });

  </script>

</body>
</html>
